worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  access_log /dev/stdout;

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend  { server 127.0.0.1:4000; keepalive 32; }
  upstream frontend { server 127.0.0.1:3000; keepalive 32; }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-running SSH actions: SSH_INSTALL_TIMEOUT_MS = 30 min
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Socket.IO (HTTP long-poll handshake + WS upgrade)
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }

    # REST API
    location /api/ {
      proxy_pass http://backend;
    }

    # Next.js (pages, RSC, /_next/*, static)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
